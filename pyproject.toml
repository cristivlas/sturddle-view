[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sturddle-view"
version = "0.1.8"
description = "Browser-based chess GUI for human vs engine play and headless tournament observation."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Cristian Vlasceanu" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "wsproto>=1.0",
    "python-chess>=1.999",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psutil>=5.9",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=5.0",
    "ruff>=0.4",
    "httpx>=0.27",
    "playwright>=1.40",
]

[project.scripts]
sturddle-view = "sturddle_view.__main__:main"

[tool.setuptools.packages.find]
where = ["server"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["server/tests"]
filterwarnings = ["error"]
