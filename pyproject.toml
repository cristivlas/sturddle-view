[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sturddle-view"
version = "0.4.7"
description = "Browser-based chess GUI for human vs engine play and headless tournament observation."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Cristian Vlasceanu" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "wsproto>=1.0",
    "python-chess>=1.999",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psutil>=5.9",
    "platformdirs>=4.0",
    "keyring>=25.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=5.0",
    "ruff>=0.4",
    "playwright>=1.40",
    # Starlette >=1.3 moved its TestClient backend from httpx to httpx2.
    "httpx2>=2.0",
]

[project.scripts]
sturddle-view = "sturddle_view.__main__:main"

[tool.setuptools.packages.find]
where = ["server"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Default set (E4/E7/E9, F) plus E302 (2 blank lines before a top-level def).
# E302 is preview-gated in this ruff version, so preview is on but scoped to
# exactly these codes -- no other preview rules are pulled in.
preview = true
explicit-preview-rules = true
select = ["E4", "E7", "E9", "F", "E302"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["server/tests"]
filterwarnings = ["error"]
addopts = "-m 'not e2e and not perf' --benchmark-time-unit=ms --benchmark-columns=mean,stddev,median,rounds --benchmark-disable-gc --benchmark-warmup=on"
markers = [
    "e2e: end-to-end tests requiring a live browser (playwright)",
    "perf: performance benchmarks",
]
