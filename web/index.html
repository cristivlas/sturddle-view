<!doctype html>
<html lang="en" class="wa-dark wa-danger-orange">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SturddleView</title>
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./favicon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="stylesheet" href="./vendor/cm-chessboard/assets/chessboard.css" />
  <link rel="stylesheet" href="./vendor/cm-chessboard/assets/extensions/markers/markers.css" />
  <link rel="stylesheet" href="./vendor/cm-chessboard/assets/extensions/arrows/arrows.css" />
  <link rel="stylesheet" href="./vendor/cm-chessboard/assets/extensions/promotion-dialog/promotion-dialog.css" />
  <link rel="stylesheet" href="./vendor/cm-chessboard-position-editor/assets/select-piece-dialog.css" />
  <link rel="stylesheet" href="./vendor/webawesome/styles/webawesome.css" />
  <link rel="stylesheet" href="./vendor/winbox/dist/css/winbox.min.css" />
  <script type="module" src="./app/wa-bootstrap.js"></script>
  <script src="./vendor/winbox/dist/js/winbox.min.js"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <h1>SturddleView</h1>
    <nav id="perspective-nav"></nav>
    <span id="paused-badge" class="status-badge status-badge--paused hidden" aria-live="polite">Paused</span>
    <span id="finished-badge" class="status-badge status-badge--finished hidden" aria-live="polite"></span>
    <span id="conn-status" class="conn" aria-label="connection status"></span>
    <button id="about-btn" class="icon-btn" aria-label="About" title="About">
      <wa-icon name="circle-info"></wa-icon>
    </button>
    <button id="settings-btn" class="icon-btn" aria-label="Settings" title="Settings">
      <wa-icon name="gear"></wa-icon>
    </button>
  </header>

  <main id="perspective-root"></main>

  <script type="module" src="./app/main.js"></script>
</body>
</html>
